[project]
name = "speckle-bundle-spec"
version = "1.4.0"
description = "Speckle bundle format vocabulary: generated Rel/NodeKind enums, catalog rows, table schemas and column indices. SCHEMA_VERSION is the package version."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Speckle Systems", email = "devops@speckle.systems" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
repository = "https://github.com/specklesystems/speckle-bundle-spec"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speckle_bundle_spec"]
